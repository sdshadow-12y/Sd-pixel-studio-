<!DOCTYPE html>

<html lang="en">
<head>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;

  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_44 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_44" style="display:block;"><svg height="100%" viewbox="0 0 512 512" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Background Gradient -->
<radialgradient cx="50%" cy="40%" id="bgGlow" r="60%">
<stop offset="0%" stop-color="#181c24"></stop>
<stop offset="60%" stop-color="#0b0e14"></stop>
<stop offset="100%" stop-color="#05070a"></stop>
</radialgradient>
<!-- Liquid S Gradient (Cyan to Vibrant Blue) -->
<lineargradient id="gradS" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00e5ff"></stop>
<stop offset="50%" stop-color="#0088ff"></stop>
<stop offset="100%" stop-color="#1a4bff"></stop>
</lineargradient>
<!-- Liquid D Gradient (Purple to Neon Pink to Amber Glow) -->
<lineargradient id="gradD" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#5522e0"></stop>
<stop offset="50%" stop-color="#ba13d6"></stop>
<stop offset="100%" stop-color="#ff3388"></stop>
</lineargradient>
<!-- Orange Accent Energy Gradient -->
<lineargradient id="gradOrange" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ffb347"></stop>
<stop offset="100%" stop-color="#ff7b00"></stop>
</lineargradient>
<!-- Specular Liquid Shimmer -->
<lineargradient id="specularGleam" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"></stop>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"></stop>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
</lineargradient>
<!-- Glass & Drop Shadow Filters -->
<filter height="140%" id="neonGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="12"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
<filter height="140%" id="dropletShadow" width="140%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="16" flood-color="#000000" flood-opacity="0.7" stddeviation="18"></fedropshadow>
<fedropshadow dx="0" dy="4" flood-color="#00b4d8" flood-opacity="0.25" stddeviation="8"></fedropshadow>
</filter>
</defs>
<style>
    /* Continuous Breathing & Floating */
    @keyframes studioFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.5deg); }
    }
    
    /* Water Ripple Dispersion Waves */
    @keyframes waterRipple {
      0% { r: 120px; opacity: 0.6; stroke-width: 3px; }
      50% { opacity: 0.25; stroke-width: 1.5px; }
      100% { r: 230px; opacity: 0; stroke-width: 0.5px; }
    }

    /* Ambient Pulsing Aura */
    @keyframes auraPulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.12); }
    }

    /* Dispersing Pixel Blocks */
    @keyframes pixelDrift1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.95; }
      50% { transform: translate(14px, -12px) scale(1.15); opacity: 0.6; }
    }
    @keyframes pixelDrift2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.85; }
      50% { transform: translate(-12px, 10px) scale(0.9); opacity: 0.4; }
    }
    @keyframes pixelDrift3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
      50% { transform: translate(18px, 14px) scale(1.25); opacity: 0.7; }
    }
    @keyframes pixelGlowOrange {
      0%, 100% { fill: #ff9838; filter: drop-shadow(0 0 4px #ff9838); }
      50% { fill: #ffc278; filter: drop-shadow(0 0 12px #ff9838); }
    }

    /* Specular Liquid Light Gleam */
    @keyframes gleamSwipe {
      0% { transform: translateX(-350px) rotate(25deg); opacity: 0; }
      20% { opacity: 0.8; }
      50% { transform: translateX(350px) rotate(25deg); opacity: 0; }
      100% { transform: translateX(350px) rotate(25deg); opacity: 0; }
    }

    .floating-core {
      animation: studioFloat 5s ease-in-out infinite;
      transform-origin: center;
    }
    .ripple-ring-1 {
      animation: waterRipple 4.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      transform-origin: center;
    }
    .ripple-ring-2 {
      animation: waterRipple 4.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: 2.25s;
      transform-origin: center;
    }
    .aura-circle {
      animation: auraPulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .pixel-p1 { animation: pixelDrift1 4s ease-in-out infinite; }
    .pixel-p2 { animation: pixelDrift2 3.6s ease-in-out infinite 0.5s; }
    .pixel-p3 { animation: pixelDrift3 4.2s ease-in-out infinite 1s; }
    .pixel-accent { animation: pixelGlowOrange 2.5s ease-in-out infinite; }
    .gleam-bar {
      animation: gleamSwipe 5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
<!-- App Icon Squircle Container -->
